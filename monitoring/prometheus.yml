global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sentinelcache-proxy
    static_configs:
      - targets: ["proxy:8080"]
        labels:
          role: proxy

  - job_name: sentinelcache-nodes
    static_configs:
      - targets:
          - "cache-node-1:8080"
          - "cache-node-2:8080"
          - "cache-node-3:8080"
        labels:
          role: cache-node
