services:
  cache-node-1:
    build: .
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - MAX_SIZE=1000
      - CLEANUP_INTERVAL=5s
    networks:
      - cache-network

  cache-node-2:
    build: .
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - MAX_SIZE=1000
      - CLEANUP_INTERVAL=5s
    networks:
      - cache-network

  cache-node-3:
    build: .
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - MAX_SIZE=1000
      - CLEANUP_INTERVAL=5s
    networks:
      - cache-network

  proxy:
    build: .
    command: ["./cache-proxy"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODES=http://cache-node-1:8080,http://cache-node-2:8080,http://cache-node-3:8080
      - VNODES=50
      - REPLICATION=3
      - WRITE_QUORUM=2
      - READ_QUORUM=2
      - HEALTH_INTERVAL=2s
      - HEALTH_FAIL_THRESHOLD=3
      - HEALTH_RECOVER_THRESHOLD=2
    depends_on:
      - cache-node-1
      - cache-node-2
      - cache-node-3
    networks:
      - cache-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - proxy
    networks:
      - cache-network

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - "8091:8081"
    environment:
      - RENDERING_TOKEN=renderme123
    networks:
      - cache-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://grafana:3000/
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=renderme123
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - grafana-renderer
    networks:
      - cache-network

networks:
  cache-network:
    driver: bridge
